name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: methodwise-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: methodwise-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            name: methodwise-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: methodwise-macos-arm64

    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/methodwise.exe ${{ matrix.name }}
          else
            cp target/${{ matrix.target }}/release/methodwise ${{ matrix.name }}
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.name }}
